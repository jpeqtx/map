<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPEQ Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin:0; }
        #map { width:100vw; height:100vh; }
        .legend {
            background: white;
            padding: 10px 14px;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 13px;
            line-height: 1.6;
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
        }
        .legend-item { display: flex; align-items: center; margin: 2px 0; }
        .legend-color {
            width: 18px; height: 18px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid #666;
        }
        .osm-attribution {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255,255,255,0.9);
            padding: 2px 6px;
            font-size: 10px;
            font-family: sans-serif;
            z-index: 1002;
            border-radius: 0 0 0 3px;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
            line-height: 1.4;
        }
        .osm-attribution a {
            color: #0078d4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="osm-attribution">
        &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors
    </div>
    <div class="legend" id="legend" style="display:none;">
        <div class="legend-item"><div class="legend-color" style="background:rgba(255,0,0,0.5);"></div> Storm Area</div>
        <div class="legend-item"><div class="legend-color" style="background:rgba(255,165,0,0.4);"></div> Gale Area</div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const lat = parseFloat(params.get('lat'));
        const lng = parseFloat(params.get('lng'));
        const storm = parseFloat(params.get('storm'));
        const gale = parseFloat(params.get('gale'));
        const type = params.get('type');
        const dir = params.get('dir');   // e.g., "NNE"
        const spd = parseFloat(params.get('spd')); // speed in km/h

        const isEpicenter = (type === 'epicenter' || type === 'ep');

        document.title = isEpicenter ? 'Epicenter' : 'Typhoon Wind Areas';

        // direction string -> angle (degrees, 0=N, clockwise)
        function directionToAngle(dirStr) {
            const dirMap = {
                'N': 0, 'NNE': 22.5, 'NE': 45, 'ENE': 67.5,
                'E': 90, 'ESE': 112.5, 'SE': 135, 'SSE': 157.5,
                'S': 180, 'SSW': 202.5, 'SW': 225, 'WSW': 247.5,
                'W': 270, 'WNW': 292.5, 'NW': 315, 'NNW': 337.5
            };
            return dirMap[dirStr] || 0;
        }

        function createArrowIcon(angleDeg) {
            return L.divIcon({
                className: 'arrow-icon',
                html: `<svg width="32" height="32" viewBox="0 0 32 32" style="transform: rotate(${angleDeg}deg);">
                        <polygon points="16,4 24,28 16,22 8,28" fill="#0078d4" stroke="#003d6b" stroke-width="1.5"/>
                       </svg>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -16]
            });
        }

        const map = L.map('map', {
            attributionControl: false
        }).setView([35, 135], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18
        }).addTo(map);

        if (!isNaN(lat) && !isNaN(lng)) {
            map.setView([lat, lng], 7);
            const marker = L.marker([lat, lng]).addTo(map);

            if (isEpicenter) {
                marker.bindTooltip('Epicenter', {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -10]
                });
            } else {
                marker.bindTooltip('Near the center of the typhoon', {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -10]
                });
                marker.bindPopup('Typhoon Center');

                // Draw arrow if direction is present
                if (dir && !isNaN(spd) && spd > 0) {
                    const angle = directionToAngle(dir);
                    // Place arrow slightly offset from center to avoid overlap with marker
                    const arrowLat = lat + 0.03; // about 3.3km north
                    const arrowLng = lng;
                    const arrowIcon = createArrowIcon(angle);
                    const arrowMarker = L.marker([arrowLat, arrowLng], { icon: arrowIcon }).addTo(map);
                    arrowMarker.bindPopup(`Movement: ${dir} ${spd} km/h`);
                }

                let hasCircles = false;
                if (!isNaN(gale) && gale > 0) {
                    L.circle([lat, lng], {
                        radius: gale * 1000,
                        color: 'orange',
                        fillOpacity: 0.15
                    }).addTo(map).bindPopup(`Gale Area: ${gale} km radius`);
                    hasCircles = true;
                }
                if (!isNaN(storm) && storm > 0) {
                    L.circle([lat, lng], {
                        radius: storm * 1000,
                        color: 'red',
                        fillOpacity: 0.25
                    }).addTo(map).bindPopup(`Storm Area: ${storm} km radius`);
                    hasCircles = true;
                }
                if (hasCircles) {
                    document.getElementById('legend').style.display = 'block';
                }
            }
        } else {
            alert('Please provide lat and lng as URL parameters.');
        }
    </script>
</body>
</html>
