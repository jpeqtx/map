<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPEQ Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin:0; }
        #map { width:100vw; height:100vh; }
        .legend {
            background: white;
            padding: 10px 14px;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 13px;
            line-height: 1.6;
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
        }
        .legend-item { display: flex; align-items: center; margin: 2px 0; }
        .legend-color {
            width: 18px; height: 18px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid #666;
        }
        .osm-attribution {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255,255,255,0.9);
            padding: 2px 6px;
            font-size: 10px;
            font-family: sans-serif;
            z-index: 1002;
            border-radius: 0 0 0 3px;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
            line-height: 1.4;
        }
        .osm-attribution a {
            color: #0078d4;
            text-decoration: none;
        }

        /* --- 波紋アニメーション用 CSS --- */
        @keyframes ripple {
            0%   { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .ripple-container {
            overflow: visible !important;
            background: transparent !important;
            border: none !important;
        }
        .ripple-circle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: ripple 2s ease-out infinite;
            transform-origin: center center;
        }

        /* 矢印を最前面に */
        .arrow-icon {
            z-index: 1000 !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="osm-attribution">
        &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors
    </div>
    <div class="legend" id="legend" style="display:none;">
        <div class="legend-item"><div class="legend-color" style="background:rgba(255,0,0,0.5);"></div> Storm Area</div>
        <div class="legend-item"><div class="legend-color" style="background:rgba(255,165,0,0.4);"></div> Gale Area</div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const lat = parseFloat(params.get('lat'));
        const lng = parseFloat(params.get('lng'));
        const storm = parseFloat(params.get('storm'));
        const gale = parseFloat(params.get('gale'));
        const type = params.get('type');
        const dir = params.get('dir');
        const spd = parseFloat(params.get('spd'));
        const mag = parseFloat(params.get('mag'));

        const isEpicenter = (type === 'epicenter' || type === 'ep');

        document.title = isEpicenter ? 'Epicenter' : 'Typhoon Wind Areas';

        // --- 進行方向 → 角度 ---
        function directionToAngle(dirStr) {
            const dirMap = {
                'N': 0, 'NNE': 22.5, 'NE': 45, 'ENE': 67.5,
                'E': 90, 'ESE': 112.5, 'SE': 135, 'SSE': 157.5,
                'S': 180, 'SSW': 202.5, 'SW': 225, 'WSW': 247.5,
                'W': 270, 'WNW': 292.5, 'NW': 315, 'NNW': 337.5
            };
            return dirMap[dirStr] || 0;
        }

        function createArrowIcon(angleDeg) {
            return L.divIcon({
                className: 'arrow-icon',
                html: `<svg width="32" height="32" viewBox="0 0 32 32" style="transform: rotate(${angleDeg}deg);">
                        <polygon points="16,4 24,28 16,22 8,28" fill="#0078d4" stroke="#003d6b" stroke-width="1.5"/>
                       </svg>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -16]
            });
        }

        // --- マグニチュード → 色（対数スケール） ---
        function magnitudeColor(m) {
            const M_MIN = 2.0;
            const M_MAX = 9.0;
            let t = (Math.log10(m) - Math.log10(M_MIN)) /
                    (Math.log10(M_MAX) - Math.log10(M_MIN));
            t = Math.max(0, Math.min(1, t));
            const hue = 240 * (1 - t);
            return `hsl(${hue}, 100%, 50%)`;
        }

        // --- 波紋アイコン生成 ---
        function createRippleIcon(magnitude) {
            const baseRadius = 10;
            const scaleFactor = 8;
            const radius = baseRadius + scaleFactor * (magnitude - 2);
            const maxScale = 2.5;
            const size = Math.ceil(radius * 2 * maxScale);
            const color = magnitudeColor(magnitude);

            return L.divIcon({
                className: 'ripple-container',
                html: `<div class="ripple-circle" style="
                    width:${radius*2}px;
                    height:${radius*2}px;
                    left:${size/2 - radius}px;
                    top:${size/2 - radius}px;
                    background:${color};
                    opacity:0.3;
                    border:2px solid ${color};
                "></div>`,
                iconSize: [size, size],
                iconAnchor: [size/2, size/2]
            });
        }

        // --- 地図上の距離から円周上の座標を計算 ---
        function destinationFromBearing(centerLat, centerLng, radiusMeters, bearingDeg) {
            const R = 6371000; // 地球の半径(m)
            const lat1 = centerLat * Math.PI / 180;
            const lng1 = centerLng * Math.PI / 180;
            const brng = bearingDeg * Math.PI / 180;
            const d = radiusMeters / R;

            const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) +
                                   Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
            const lng2 = lng1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1),
                                          Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
            return [lat2 * 180 / Math.PI, lng2 * 180 / Math.PI];
        }

        // --- マップ初期化 ---
        const map = L.map('map', {
            attributionControl: false
        }).setView([35, 135], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18
        }).addTo(map);

        if (!isNaN(lat) && !isNaN(lng)) {
            map.setView([lat, lng], 7);
            const marker = L.marker([lat, lng]).addTo(map);

            if (isEpicenter) {
                marker.bindTooltip('Epicenter', {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -10]
                });

                // 波紋アニメーション
                if (!isNaN(mag) && mag > 0) {
                    const rippleIcon = createRippleIcon(mag);
                    L.marker([lat, lng], {
                        icon: rippleIcon,
                        zIndexOffset: 500,
                        interactive: false
                    }).addTo(map);
                }
            } else {
                // --- 台風モード ---
                marker.bindTooltip('Near the center of the typhoon', {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -10]
                });
                marker.bindPopup('Typhoon Center');

                // 進行方向の矢印
                if (dir && !isNaN(spd) && spd > 0) {
                    const angle = directionToAngle(dir);
                    const arrowLat = lat - 0.05;
                    const arrowLng = lng;
                    const arrowIcon = createArrowIcon(angle);
                    const arrowMarker = L.marker([arrowLat, arrowLng], {
                        icon: arrowIcon,
                        zIndexOffset: 1000
                    }).addTo(map);
                    arrowMarker.bindPopup(`Movement: ${dir} ${spd} km/h`);
                }

                // --- 静的円（正確な暴風域・強風域） ---
                let hasCircles = false;
                if (!isNaN(gale) && gale > 0) {
                    L.circle([lat, lng], {
                        radius: gale * 1000,
                        color: 'orange',
                        fillOpacity: 0.15,
                        weight: 2
                    }).addTo(map).bindPopup(`Gale Area: ${gale} km radius`);
                    hasCircles = true;
                }
                if (!isNaN(storm) && storm > 0) {
                    L.circle([lat, lng], {
                        radius: storm * 1000,
                        color: 'red',
                        fillOpacity: 0.25,
                        weight: 2
                    }).addTo(map).bindPopup(`Storm Area: ${storm} km radius`);
                    hasCircles = true;
                }
                if (hasCircles) {
                    document.getElementById('legend').style.display = 'block';
                }

                // --- 光点周回アニメーション ---
                const orbitingDots = [];

                function createOrbitingDots(radiusKm, color, count, speedDegPerSec, offsetPhaseDeg) {
                    const radiusMeters = radiusKm * 1000;
                    const dots = [];
                    for (let i = 0; i < count; i++) {
                        const dot = L.circleMarker([0, 0], {
                            radius: 4,
                            color: color,
                            fillColor: color,
                            fillOpacity: 0.8,
                            weight: 1.5,
                            interactive: false,
                            zIndexOffset: 300
                        }).addTo(map);
                        dots.push({
                            marker: dot,
                            phaseDeg: offsetPhaseDeg + (360 / count) * i
                        });
                    }
                    return { dots, radiusMeters, speedDegPerSec };
                }

                // 強風域の光点（オレンジ、4個、15度/秒）
                if (!isNaN(gale) && gale > 0) {
                    const galeOrbit = createOrbitingDots(gale, 'orange', 4, 15, 0);
                    orbitingDots.push(galeOrbit);
                }
                // 暴風域の光点（赤、3個、20度/秒）
                if (!isNaN(storm) && storm > 0) {
                    const stormOrbit = createOrbitingDots(storm, 'red', 3, 20, 60);
                    orbitingDots.push(stormOrbit);
                }

                // アニメーションループ
                let lastTime = performance.now();
                function animateOrbits(now) {
                    const dt = (now - lastTime) / 1000; // 秒
                    lastTime = now;
                    for (const orbit of orbitingDots) {
                        for (const dotInfo of orbit.dots) {
                            // 北半球の反時計回り（角度を減少）
                            dotInfo.phaseDeg = (dotInfo.phaseDeg - orbit.speedDegPerSec * dt + 360) % 360;
                            const newPos = destinationFromBearing(lat, lng, orbit.radiusMeters, dotInfo.phaseDeg);
                            dotInfo.marker.setLatLng(newPos);
                        }
                    }
                    requestAnimationFrame(animateOrbits);
                }
                requestAnimationFrame(animateOrbits);
            }
        } else {
            alert('Please provide lat and lng as URL parameters.');
        }
    </script>
</body>
</html>
